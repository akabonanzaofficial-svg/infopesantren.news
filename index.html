function injectReadAlso(htmlContent, allData, currentItem) {
  if (!htmlContent) return '';
  
  // 1. Ambil semua artikel dari semua kategori, kecuali artikel yang sedang dibaca
  const pool = [
    ...(allData.berita || []).map(x => ({...x, _type: 'berita'})),
    ...(allData.program || []).map(x => ({...x, _type: 'program'})),
    ...(allData.khazanah || []).map(x => ({...x, _type: 'khazanah'})),
    ...(allData.tokoh || []).map(x => ({...x, _type: 'tokoh'})),
    ...(allData.agenda || []).map(x => ({...x, _type: 'agenda'}))
  ].filter(x => x.id !== currentItem.id && x.slug);

  if (pool.length === 0) return htmlContent;

  // 2. Pilih 1 artikel secara acak
  const randomPick = pool[Math.floor(Math.random() * pool.length)];
  
  // 3. Buat HTML untuk kotak "Baca Juga" (Hanya Teks)
  const title = randomPick.title || randomPick.name || 'Artikel Lainnya';
  const url = `/${randomPick._type}/${randomPick.slug}`;
  
  const readAlsoHTML = `
    <div class="my-6 bg-brand-50 rounded-lg border-l-4 border-brand-500 p-4">
      <span class="text-[10px] font-bold text-brand-700 uppercase tracking-widest block mb-1">Baca Juga</span>
      <a href="${url}" class="text-base md:text-lg font-bold text-gray-900 hover:text-brand-700 leading-snug transition-colors block">
        ${title}
      </a>
    </div>
  `;

  // 4. Sisipkan setelah paragraf ke-2
  const parts = htmlContent.split('</p>');
  
  // Jika artikel terlalu pendek (kurang dari 2 paragraf), jangan sisipkan
  if (parts.length < 2) return htmlContent;

  // Gabungkan kembali: Paragraf 1, Paragraf 2, Kotak Baca Juga, Paragraf 3 dst.
  return parts[0] + '</p>' + 
         (parts[1] ? parts[1] + '</p>' : '') + 
         readAlsoHTML + 
         parts.slice(2).join('</p>');
}
