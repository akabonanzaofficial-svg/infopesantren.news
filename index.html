      // =====================================================================
      // DATA FETCHER (data.json → fallback embedded)
      // =====================================================================
      let DATA_CACHE = null;
      let DATA_PROMISE = null;

      async function getData() {
        if (DATA_CACHE) return DATA_CACHE;
        if (DATA_PROMISE) return DATA_PROMISE;
        DATA_PROMISE = (async () => {
          try {
            // Coba fetch data.json (hanya bekerja via http/https)
            if (window.location.protocol === 'file:') {
              throw new Error('file:// — pakai fallback embedded');
            }
            const res = await fetch('/data.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            DATA_CACHE = {
              meta: json.meta || {},
              berita: json.berita || [],
              program: json.program || [],
              khazanah: json.khazanah || [],
              tokoh: json.tokoh || [],
              agenda: json.agenda || [],
            };
            console.info('[getData] memuat dari /data.json');
            return DATA_CACHE;
          } catch (err) {
            console.warn('[getData] fallback ke data embedded:', err.message);
            DATA_CACHE = DATA_FALLBACK;
            return DATA_CACHE;
          }
        })();
        return DATA_PROMISE;
      }

      // =====================================================================

      function formatTanggal(iso, opts = {}) {
        if (!iso) return '-';
        try {
          return new Date(iso).toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            ...opts,
          });
        } catch {
          return '-';
        }
      }

      function formatTanggalWaktu(iso) {
        return formatTanggal(iso, { hour: '2-digit', minute: '2-digit' });
      }

            function sanitizeHTML(html) {
        if (!html) return '';
        // Izinkan tag HTML standar dari Quill (termasuk gambar, heading, list, dll)
        if (window.DOMPurify) {
          return window.DOMPurify.sanitize(html, {
            ADD_TAGS: ['iframe'], 
            ADD_ATTR: ['target', 'allowfullscreen', 'frameborder']
          });
        }
        return String(html);
      }

      // =====================================================================

      // =====================================================================
      function parsePath() {
        let path = '/';
        try {
          path = window.location.pathname || '/';
          // Untuk file:// — pakai hash jika ada
          if (window.location.protocol === 'file:') {
            const hash = window.location.hash.replace(/^#/, '');
            if (hash) path = hash;
          }
        } catch {
          path = '/';
        }
        const parts = path.split('/').filter(Boolean);
        if (parts.length === 0) return { view: 'home', slug: null };
        const first = parts[0];
        const valid = ['berita', 'program', 'khazanah', 'tokoh', 'agenda'];
        if (!valid.includes(first)) return { view: 'home', slug: null };
        return { view: first, slug: parts[1] || null };
      }

      function navigate(path) {
        try {
          if (window.location.protocol === 'file:') {
            // file:// — gunakan hash
            window.location.hash = path;
          } else {
            if (window.location.pathname !== path) {
              window.history.pushState({}, '', path);
            }
          }
        } catch (e) {
          console.warn('navigate error', e);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        window.dispatchEvent(new PopStateEvent('popstate'));
      }

                  React.createElement(

                  item.expertise &&

              },
              React.createElement(Icon, { name: 'arrow-left', className: 'w-4 h-4' }),
              ' Kembali ke Agenda'
            ),
            React.createElement(

                item.status &&

                          ? 'bg-brand-600'

                          ? 'bg-gold-600'
                          : 'bg-gray-500'),
                    },
                    item.status
                  ),
                React.createElement(
                  'h1',
                  { className: 'text-3xl font-bold text-gray-900 mb-4' },
                  item.title
                ),
                React.createElement(

                  {
                    className:
                      'grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 pb-6 border-b border-gray-200',

                  item.date_start &&
                    React.createElement(
                      'div',
                      null,
                      React.createElement(
                        'p',
                        { className: 'text-xs text-gray-500 uppercase font-semibold' },
                        'Mulai'
                      ),
                      React.createElement(
                        'p',
                        {
                          className:
                            'text-sm font-bold text-gray-900 mt-1 flex items-center gap-1',

                        React.createElement(Icon, {

                          className: 'w-4 h-4 text-brand-600',
                        }),

                      )
                    ),
                  item.date_end &&
                    React.createElement(

                      ),
                      React.createElement(

                        {

                      )
                    ),
                  item.location &&
                    React.createElement(

                      ),

                    React.createElement(

      }

      // =====================================================================
      // SEARCH VIEW
      // =====================================================================
      function SearchView({ query }) {
        const [results, setResults] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          let mounted = true;
          setLoading(true);
          getData()
            .then((data) => {
              if (!mounted) return;
              const q = query.toLowerCase();
              const combined = [
                ...data.berita.map((x) => ({ ...x, _type: 'berita' })),
                ...data.program.map((x) => ({ ...x, _type: 'program' })),
                ...data.khazanah.map((x) => ({ ...x, _type: 'khazanah' })),
                ...data.tokoh.map((x) => ({ ...x, _type: 'tokoh' })),
                ...data.agenda.map((x) => ({ ...x, _type: 'agenda' })),
              ];
              const filtered = combined.filter((item) => {
                const hay = [
                  item.title,
                  item.name,
                  item.summary,
                  item.description,
                  item.bio,
                  item.category,
                  item.author,
                ]
                  .filter(Boolean)
                  .join(' ')
                  .toLowerCase();
                return hay.includes(q);
              });
              setResults(filtered);
              setLoading(false);
            })
            .catch(() => setLoading(false));
          return () => {
            mounted = false;
          };
        }, [query]);

        return React.createElement(
          'div',
          { className: 'max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10' },
          React.createElement(
            'h1',
            { className: 'text-2xl font-bold text-gray-900 mb-2' },
            'Hasil Pencarian'
          ),
          React.createElement(
            'p',
            { className: 'text-gray-500 mb-8' },
            'Kata kunci: ',
            React.createElement('strong', { className: 'text-brand-700' }, '"' + query + '"'),
            ' — ',
            loading ? 'memuat...' : results.length + ' hasil'
          ),
          loading
            ? React.createElement(SkeletonGrid, { count: 3 })
            : results.length === 0
            ? React.createElement(EmptyState, {
                icon: 'search-x',
                title: 'Tidak ada hasil',
                desc: 'Coba kata kunci lain.',
              })
            : React.createElement(
                'div',
                { className: 'space-y-4' },
                results.map((item, i) =>
                  React.createElement(
                    'div',
                    {
                      key: i,
                      onClick: () => navigate('/' + item._type + '/' + item.slug),
                      className:
                        'bg-white rounded-xl border border-gray-100 p-5 hover:border-brand-200 hover:shadow cursor-pointer transition-all',
                    },
                    React.createElement(
                      'span',
                      {
                        className:
                          'inline-block text-[10px] font-bold uppercase tracking-wider text-brand-700 bg-brand-50 px-2 py-0.5 rounded mb-2',
                      },
                      item._type
                    ),
                    React.createElement(
                      'h3',
                      {
                        className:
                          'text-lg font-bold text-gray-900 mb-1 hover:text-brand-700',
                      },
                      item.title || item.name
                    ),
                    React.createElement(
                      'p',
                      { className: 'text-sm text-gray-500 line-clamp-2' },
                      item.summary || item.description || item.bio
                    )
                  )
                )
              )
        );
      }

      // =====================================================================
      // APP
      // =====================================================================
      function App() {
        const [route, setRoute] = useState(parsePath());
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [searchQuery, setSearchQuery] = useState(null);

        useEffect(() => {
          function onPop() {
            setRoute(parsePath());
            setSearchQuery(null);
          }
          window.addEventListener('popstate', onPop);
          window.addEventListener('hashchange', onPop);
          return () => {
            window.removeEventListener('popstate', onPop);
            window.removeEventListener('hashchange', onPop);
          };
        }, []);

        useEffect(() => {
          let mounted = true;
          setLoading(true);
          getData()
            .then((d) => {
              if (mounted) {
                setData(d);
                setLoading(false);
              }
            })
            .catch((err) => {
              if (mounted) {
                setError(err);
                setLoading(false);
              }
            });
          return () => {
            mounted = false;
          };
        }, []);

        function handleSearch(q) {
          setSearchQuery(q);
          window.scrollTo({ top: 0 });
        }

        function retry() {
          setError(null);
          setLoading(true);
          getData()
            .then((d) => {
              setData(d);
              setLoading(false);
            })
            .catch((e) => {
              setError(e);
              setLoading(false);
            });
        }

        useEffect(() => {
          if (searchQuery) {
            document.title = 'Cari "' + searchQuery + '" — ' + SITE.name;
            return;
          }
          const { view, slug } = route;
          if (view === 'home') {
            document.title = SITE.name + '.online — ' + SITE.tagline;
          } else {
            let title = view.charAt(0).toUpperCase() + view.slice(1);
            if (slug && data) {
              const item = (data[view] || []).find((x) => x.slug === slug);
              if (item) title = item.title || item.name;
            }
            document.title = title + ' — ' + SITE.name;
          }
        }, [route, data, searchQuery]);

        let content;
        if (loading) {
          content = React.createElement(
            'div',
            { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12' },
            React.createElement(
              'div',
              { className: 'animate-pulse space-y-8' },
              React.createElement('div', { className: 'h-96 bg-gray-200 rounded-2xl' }),
              React.createElement(SkeletonGrid, { count: 3 })
            )
          );
        } else if (error) {
          content = React.createElement(ErrorState, { onRetry: retry });
        } else if (searchQuery) {
          content = React.createElement(SearchView, { query: searchQuery });
        } else if (route.view === 'home') {
          content = React.createElement(HomeView, { data });
        } else if (route.slug) {
          content = React.createElement(DetailView, {
            type: route.view,
            slug: route.slug,
            data,
          });
        } else {
          content = React.createElement(ListView, { type: route.view, data });
        }

        return React.createElement(
          'div',
          { className: 'min-h-screen bg-gray-50 flex flex-col' },
          React.createElement(Header, { currentRoute: route, onSearch: handleSearch }),
          React.createElement('main', { className: 'flex-1' }, content),
          React.createElement(Footer, null)
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
