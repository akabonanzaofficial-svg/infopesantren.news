<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — InfoPesantren.online</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 700: '#047857' }, gold: { 500: '#f59e0b' } } } } }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <style> 
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
      .ql-editor { min-height: 250px; font-family: 'Merriweather', serif; font-size: 16px; }
      .ql-container { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
      .ql-toolbar { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; background: #f9fafb; }
      html, body { overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { useState, useEffect, useRef } = React;
      const API_URL = 'https://infopesantren-api.akabonanza-official.workers.dev';

      const SECTIONS = [
        { id: 'berita', label: 'Berita', icon: 'newspaper' },
        { id: 'program', label: 'Program', icon: 'graduation-cap' },
        { id: 'khazanah', label: 'Khazanah', icon: 'book-marked' },
        { id: 'tokoh', label: 'Tokoh', icon: 'user-round' },
        { id: 'agenda', label: 'Agenda', icon: 'calendar-days' }
      ];

      function Icon({ name, className = 'w-5 h-5' }) {
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
        return React.createElement('i', { 'data-lucide': name, className });
      }

      const formatForInput = (dateObj) => {
        const d = new Date(dateObj);
        if (isNaN(d.getTime())) return ''; 
        const pad = (num) => String(num).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      const uploadImage = async (file, auth) => {
        if (file.size > 2 * 1024 * 1024) throw new Error('Ukuran gambar melebihi 2MB.');
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
          reader.onload = async (e) => {
            const base64 = e.target.result.split(',')[1];
            const ext = file.name.split('.').pop();
            const filename = `img-${Date.now()}.${ext}`;
            try {
              const res = await fetch(`${API_URL}/api/upload`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(`${auth.username}:${auth.password}`) },
                body: JSON.stringify({ filename, base64 })
              });
              const json = await res.json();
              if (json.success) resolve(json.url);
              else reject(new Error(json.error));
            } catch (err) { reject(err); }
          };
          reader.readAsDataURL(file);
        });
      };

      function Login({ onLogin }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (username && password) onLogin({ username, password });
        };

        return React.createElement('div', { className: 'min-h-screen flex items-center justify-center bg-gray-100 p-4' },
          React.createElement('div', { className: 'bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-brand-600' },
            React.createElement('div', { className: 'text-center mb-8' },
              React.createElement('h1', { className: 'text-2xl font-extrabold text-gray-900' }, 'Admin Panel'),
              React.createElement('p', { className: 'text-gray-500 text-sm mt-1' }, 'InfoPesantren.online')
            ),
            React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' },
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Username'),
                React.createElement('input', { type: 'text', required: true, value: username, onChange: (e) => setUsername(e.target.value), className: 'w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500 outline-none' })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Password'),
                React.createElement('div', { className: 'relative' },
                  React.createElement('input', { type: showPassword ? 'text' : 'password', required: true, value: password, onChange: (e) => setPassword(e.target.value), className: 'w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500 outline-none pr-10' }),
                  React.createElement('button', { type: 'button', onClick: () => setShowPassword(!showPassword), className: 'absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600' }, React.createElement(Icon, { name: showPassword ? 'eye-off' : 'eye' }))
                )
              ),
              React.createElement('button', { type: 'submit', className: 'w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-lg mt-2' }, 'Masuk')
            )
          )
        );
      }

      function ArticleForm({ auth, initialData, onCancel, onSave }) {
        const isEdit = !!initialData;
        const [formData, setFormData] = useState({ 
          id: initialData?.id || '', 
          section: initialData?.section || 'berita',
          title: initialData?.title || initialData?.name || '', 
          slug: initialData?.slug || '', 
          category: initialData?.category || 'Umum', 
          author: initialData?.author || 'Admin', 
          summary: initialData?.summary || initialData?.description || initialData?.bio || '', 
          image_url: initialData?.image_url || '', 
          featured: initialData?.featured || false, 
          status: initialData?.status || 'published',
          published_at: formatForInput(initialData?.published_at || initialData?.date_start || new Date()),
          views: initialData?.views || 0,
        });
        
        const [saving, setSaving] = useState(false);
        const [previewMode, setPreviewMode] = useState(false);
        const [uploading, setUploading] = useState(false);
        const [previewContent, setPreviewContent] = useState('');
        
        const quillRef = useRef(null);
        const quillInstance = useRef(null);

        useEffect(() => {
          if (quillRef.current && !quillInstance.current) {
            quillInstance.current = new Quill(quillRef.current, {
              theme: 'snow',
              placeholder: 'Tulis isi artikel di sini...',
              modules: {
                toolbar: {
                  container: [ [{ 'header': [2, 3, false] }], ['bold', 'italic', 'underline', 'blockquote'], [{ 'list': 'ordered' }, { 'list': 'bullet' }], ['link', 'image'], ['clean'] ],
                  handlers: {
                    image: () => {
                      const input = document.createElement('input');
                      input.setAttribute('type', 'file');
                      input.setAttribute('accept', 'image/*');
                      input.click();
                      input.onchange = async () => {
                        const file = input.files[0];
                        if (file) {
                          try {
                            setUploading(true);
                            const url = await uploadImage(file, auth);
                            const range = quillInstance.current.getSelection(true);
                            quillInstance.current.insertEmbed(range.index, 'image', url);
                            quillInstance.current.setSelection(range.index + 1);
                          } catch (err) { alert(err.message); } finally { setUploading(false); }
                        }
                      };
                    }
                  }
                }
              }
            });
          }

          if (quillInstance.current) {
            if (initialData && (initialData.content || initialData.description)) {
              setTimeout(() => {
                if (quillInstance.current) {
                  quillInstance.current.clipboard.dangerouslyPasteHTML(initialData.content || initialData.description);
                }
              }, 50);
            } else {
              quillInstance.current.setText('');
            }
          }
        }, [auth, initialData]);

        const handleChange = (e) => {
          const { name, value, type, checked } = e.target;
          setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
        };

        const handleCoverUpload = async (e) => {
          const file = e.target.files[0];
          if (file) {
            try {
              setUploading(true);
              const url = await uploadImage(file, auth);
              setFormData(prev => ({ ...prev, image_url: url }));
            } catch (err) { alert(err.message); } finally { setUploading(false); }
          }
        };

        const generateSlug = () => {
          const slug = formData.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
          setFormData(prev => ({ ...prev, slug }));
        };

        const handlePreview = () => {
          const html = quillInstance.current ? quillInstance.current.root.innerHTML : '';
          setPreviewContent(html);
          setPreviewMode(true);
        };

        const handleSubmit = async (e) => {
          if (e) e.preventDefault();
          setSaving(true);
          
          const finalContent = quillInstance.current ? quillInstance.current.root.innerHTML : '';
          const isoDate = new Date(formData.published_at).toISOString();

          const payload = {
            id: formData.id || 'art-' + Date.now(),
            slug: formData.slug || 'artikel-' + Date.now(),
            title: formData.title,
            name: formData.title,
            summary: formData.summary,
            bio: formData.summary,
            description: formData.summary,
            content: finalContent,
            category: formData.category,
            author: formData.author,
            image_url: formData.image_url,
            featured: formData.featured,
            status: formData.status,
            published_at: isoDate,
            date_start: isoDate,
            views: formData.views,
          };

          try {
            const url = isEdit ? `${API_URL}/api/article/${formData.section}/${formData.id}` : `${API_URL}/api/article`;
            const method = isEdit ? 'PUT' : 'POST';

            const res = await fetch(url, {
              method: method,
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(`${auth.username}:${auth.password}`) },
              body: JSON.stringify({ ...payload, section: formData.section })
            });
            const json = await res.json();
            if (json.success) { 
              alert(isEdit ? 'Artikel diperbarui!' : 'Artikel disimpan!'); 
              onSave(); 
            } 
            else { alert('Gagal: ' + json.error); }
          } catch (err) { alert(err.message); } finally { setSaving(false); }
        };

        if (previewMode) {
          return React.createElement('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-10 max-w-4xl mx-auto' },
            React.createElement('div', { className: 'flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b gap-4' },
              React.createElement('h2', { className: 'text-lg font-bold text-gray-500 uppercase tracking-widest' }, 'Preview Artikel'),
              React.createElement('button', { onClick: () => setPreviewMode(false), className: 'text-sm font-medium text-brand-600 hover:text-brand-800 bg-brand-50 px-4 py-2 rounded-lg' }, '← Kembali Edit')
            ),
            React.createElement('span', { className: 'bg-brand-600 text-white px-3 py-1 rounded-full text-xs font-bold uppercase' }, formData.section),
            React.createElement('h1', { className: 'text-2xl md:text-3xl font-bold text-gray-900 mt-4 mb-2' }, formData.title),
            React.createElement('div', { className: 'flex gap-4 text-sm text-gray-500 mb-6 border-b pb-4' },
              React.createElement('span', null, formData.author),
              React.createElement('span', null, new Date(formData.published_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }))
            ),
            formData.image_url && React.createElement('img', { src: formData.image_url, className: 'w-full h-48 md:h-64 object-cover rounded-xl mb-6' }),
            React.createElement('div', { className: 'prose prose-sm md:prose-lg max-w-none text-gray-700 leading-relaxed overflow-x-hidden', dangerouslySetInnerHTML: { __html: previewContent } }),
            React.createElement('div', { className: 'mt-10 pt-6 border-t flex justify-end' },
              React.createElement('button', { onClick: handleSubmit, disabled: saving, className: 'w-full md:w-auto px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg' }, saving ? 'Menyimpan...' : (isEdit ? 'Update Artikel' : 'Publish Sekarang'))
            )
          );
        }

        return React.createElement('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6 pb-20 md:pb-6' },
          React.createElement('div', { className: 'flex justify-between items-center mb-6 pb-4 border-b' },
            React.createElement('h2', { className: 'text-lg md:text-xl font-bold text-gray-800' }, isEdit ? 'Edit Artikel' : 'Tulis Artikel Baru'),
            React.createElement('button', { type: 'button', onClick: onCancel, className: 'text-sm text-gray-500 hover:text-gray-800 bg-gray-100 px-3 py-1 rounded' }, 'Batal')
          ),
          React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-5' },
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 bg-brand-50 p-4 rounded-lg border border-brand-100' },
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-bold text-brand-800 mb-1' }, 'Tipe Konten (Tampil di Halaman)'),
                React.createElement('select', { name: 'section', value: formData.section, onChange: handleChange, className: 'w-full px-3 py-2 border border-brand-300 rounded-md font-semibold text-brand-700' },
                  SECTIONS.map(s => React.createElement('option', { key: s.id, value: s.id }, s.label))
                )
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Kategori / Label (Opsional)'),
                React.createElement('input', { name: 'category', value: formData.category, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md text-sm', placeholder: 'Misal: Prestasi, Fiqih, dll' })
              )
            ),
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Judul / Nama'),
                React.createElement('input', { name: 'title', required: true, value: formData.title, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md', placeholder: 'Masukkan judul...' })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium mb-1 flex justify-between' }, 'Slug URL', React.createElement('button', { type: 'button', onClick: generateSlug, className: 'text-brand-600 text-xs' }, 'Generate otomatis')),
                React.createElement('input', { name: 'slug', required: true, value: formData.slug, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md bg-gray-50', placeholder: 'judul-artikel' })
              )
            ),
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Tanggal Terbit / Mulai'),
                React.createElement('input', { type: 'datetime-local', name: 'published_at', required: true, value: formData.published_at, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md text-sm' })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Penulis / Penginput'),
                React.createElement('input', { name: 'author', value: formData.author, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md text-sm' })
              )
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Ringkasan Singkat (Summary/Bio)'),
              React.createElement('textarea', { name: 'summary', required: true, rows: 2, value: formData.summary, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md', placeholder: 'Tulis ringkasan yang akan tampil di halaman depan...' })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm font-medium mb-2' }, 'Isi Lengkap Artikel'),
              React.createElement('div', { className: 'bg-white rounded-lg border border-gray-300 overflow-hidden' },
                React.createElement('div', { ref: quillRef, className: 'text-base' })
              ),
              uploading && React.createElement('p', { className: 'text-xs text-brand-600 mt-1 animate-pulse' }, 'Sedang mengunggah gambar...')
            ),
            React.createElement('div', { className: 'border p-4 rounded-lg bg-gray-50' },
              React.createElement('label', { className: 'block text-sm font-bold mb-2' }, 'Gambar Utama / Banner'),
              React.createElement('div', { className: 'flex flex-col md:flex-row gap-4' },
                React.createElement('div', { className: 'flex-1' },
                  React.createElement('label', { className: 'text-xs text-gray-500 mb-1 block' }, 'Opsi A: URL Gambar'),
                  React.createElement('input', { name: 'image_url', value: formData.image_url, onChange: handleChange, className: 'w-full px-3 py-2 border rounded-md text-sm', placeholder: 'https://...' })
                ),
                React.createElement('div', { className: 'flex-1' },
                  React.createElement('label', { className: 'text-xs text-gray-500 mb-1 block' }, 'Opsi B: Upload (Maks 2MB)'),
                  React.createElement('input', { type: 'file', accept: 'image/*', onChange: handleCoverUpload, className: 'w-full text-sm mt-1' })
                )
              ),
              formData.image_url && React.createElement('img', { src: formData.image_url, className: 'h-20 mt-2 rounded object-cover border' })
            ),
            React.createElement('div', { className: 'flex flex-col md:flex-row gap-4 md:gap-6 md:items-center pt-2' },
              React.createElement('label', { className: 'flex items-center gap-2 text-sm' },
                React.createElement('input', { type: 'checkbox', name: 'featured', checked: formData.featured, onChange: handleChange, className: 'w-4 h-4 text-brand-600 rounded' }),
                'Jadikan Sorotan Utama (Featured)'
              ),
              React.createElement('label', { className: 'flex items-center gap-2 text-sm' },
                'Status: ',
                React.createElement('select', { name: 'status', value: formData.status, onChange: handleChange, className: 'border rounded-md px-2 py-1 text-sm' },
                  React.createElement('option', { value: 'published' }, 'Published (Tayang)'),
                  React.createElement('option', { value: 'draft' }, 'Draft (Simpan Saja)')
                )
              )
            ),
            React.createElement('div', { className: 'flex flex-col md:flex-row justify-end gap-3 pt-4 border-t mt-4' },
              React.createElement('button', { type: 'button', onClick: onCancel, className: 'w-full md:w-auto px-5 py-2 border rounded-lg hover:bg-gray-50 text-gray-600 order-2 md:order-1' }, 'Batal'),
              React.createElement('button', { type: 'button', onClick: handlePreview, className: 'w-full md:w-auto px-5 py-2 border-2 border-brand-600 text-brand-700 font-bold rounded-lg hover:bg-brand-50 flex items-center justify-center gap-2 order-1 md:order-2' },
                React.createElement(Icon, { name: 'eye', className: 'w-4 h-4' }), ' Preview'
              ),
              React.createElement('button', { type: 'submit', disabled: saving, className: 'w-full md:w-auto px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg disabled:opacity-50 flex items-center justify-center gap-2 order-3' },
                saving ? 'Menyimpan...' : React.createElement(React.Fragment, null, React.createElement(Icon, { name: 'save', className: 'w-4 h-4' }), isEdit ? ' Simpan Perubahan' : ' Simpan & Publish')
              )
            )
          )
        );
      }

      function Dashboard({ auth, onLogout }) {
        const [view, setView] = useState('list'); 
        const [activeSection, setActiveSection] = useState('berita'); // Default menu
        const [editData, setEditData] = useState(null);
        const [articles, setArticles] = useState([]);
        const [loading, setLoading] = useState(true);

        const getAuthHeader = () => 'Basic ' + btoa(`${auth.username}:${auth.password}`);

        const fetchArticles = async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API_URL}/api/content`);
            const json = await res.json();
            if (json.success && json.data && json.data.data) {
              const d = json.data.data;
              // Ambil data HANYA untuk section yang sedang aktif
              const sectionData = d[activeSection] || [];
              
              // Beri _section dan urutkan berdasarkan tanggal (terbaru di atas)
              const formatted = sectionData.map(x => ({...x, _section: activeSection}));
              formatted.sort((a, b) => new Date(b.published_at || b.date_start || 0) - new Date(a.published_at || a.date_start || 0));
              
              setArticles(formatted);
            }
          } catch (err) { 
            console.error(err);
            alert('Gagal mengambil data: ' + err.message); 
          } finally { 
            setLoading(false); 
          }
        };

        // Panggil fetch setiap kali menu kiri (activeSection) berubah
        useEffect(() => { fetchArticles(); }, [activeSection]);

        const handleDelete = async (id, section) => {
          if (!confirm('Yakin ingin menghapus artikel ini?')) return;
          try {
            const res = await fetch(`${API_URL}/api/article/${section}/${id}`, { method: 'DELETE', headers: { 'Authorization': getAuthHeader() } });
            const json = await res.json();
            if (json.success) { alert('Artikel dihapus'); fetchArticles(); } else { alert('Gagal: ' + json.error); }
          } catch (err) { alert(err.message); }
        };

        const handleEditClick = (article) => { setEditData(article); setView('edit'); };
        const handleCreateClick = () => { setEditData(null); setView('create'); };
        
        // FUNGSI BARU: Reload halaman setelah simpan agar React tidak crash
        const onSaveSuccess = () => { 
          window.location.reload(); 
        };

        const displayDate = (isoString) => {
          if (!isoString) return '-';
          return new Date(isoString).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        return React.createElement('div', { className: 'flex min-h-screen pb-16 md:pb-0' },
          
          // SIDEBAR KIRI
          React.createElement('aside', { className: 'w-64 bg-gray-900 text-white flex-col hidden md:flex fixed h-full z-10' },
            React.createElement('div', { className: 'h-16 flex items-center justify-center border-b border-gray-800 bg-gray-950' },
              React.createElement('h1', { className: 'text-xl font-extrabold tracking-wider' }, 'Info', React.createElement('span', { className: 'text-brand-500' }, 'Pesantren'), React.createElement('span', { className: 'text-gold-500' }, '.admin'))
            ),
            React.createElement('nav', { className: 'flex-1 p-4 space-y-1 overflow-y-auto' },
              // Menu Tulis Baru
              React.createElement('button', { onClick: handleCreateClick, className: `w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors mb-4 ${view === 'create' ? 'bg-brand-600 text-white' : 'bg-gray-800 hover:bg-gray-700 text-gray-200'}` },
                React.createElement(Icon, { name: 'plus-circle', className: 'w-5 h-5' }), ' Tulis Artikel Baru'
              ),
              React.createElement('div', { className: 'text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 mt-6 px-2' }, 'Kategori Konten'),
              // Loop menu kategori
              SECTIONS.map(sec => 
                React.createElement('button', { 
                  key: sec.id, 
                  onClick: () => { setActiveSection(sec.id); setView('list'); }, 
                  className: `w-full flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors ${view === 'list' && activeSection === sec.id ? 'bg-brand-600 text-white' : 'hover:bg-gray-800 text-gray-400'}` 
                },
                  React.createElement(Icon, { name: sec.icon, className: 'w-5 h-5' }), ' ', sec.label
                )

              React.createElement('button', { onClick: onLogout, className: 'w-full flex items-center justify-center gap-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg transition-colors' },
                React.createElement(Icon, { name: 'log-out', className: 'w-4 h-4' }), ' Logout'
              )

            React.createElement('div', { className: 'flex-1 p-4 md:p-8' },

                React.createElement('div', null,

                    React.createElement('h2', { className: 'text-2xl font-bold text-gray-800 capitalize' }, 'Daftar ' + activeSection),
                    React.createElement('button', { onClick: handleCreateClick, className: 'hidden md:flex bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium items-center gap-2' },
                      React.createElement(Icon, { name: 'plus', className: 'w-4 h-4' }), ' Tulis Baru'
                    )
                  ),
                  loading ? React.createElement('div', { className: 'text-center py-10 text-gray-500' }, 'Memuat data...') :
                  articles.length === 0 ? React.createElement('div', { className: 'text-center py-10 text-gray-500' }, 'Belum ada artikel di kategori ini.') :
                  React.createElement(React.Fragment, null,
                    // TAMPILAN TABEL (DESKTOP)
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-sm border overflow-hidden hidden md:block' },
                      React.createElement('table', { className: 'w-full text-left' },

                        React.createElement('tbody', null,
                          articles.map(article =>

                              React.createElement('td', { className: 'p-4 text-sm font-medium' },

                                React.createElement('button', { onClick: () => handleDelete(article.id, article._section), className: 'text-red-500 hover:text-red-700 p-1' }, React.createElement(Icon, { name: 'trash-2', className: 'w-4 h-4' }))
                              )
                            )
                          )

                      )
                    ),

                    // TAMPILAN KARTU (MOBILE)
                    React.createElement('div', { className: 'md:hidden space-y-4' },

                            ),

            )
          )
        );
      }

      function App() {
        const [auth, setAuth] = useState(null);
        useEffect(() => {
          const saved = sessionStorage.getItem('admin_auth');
          if (saved) setAuth(JSON.parse(saved));
        }, []);

        const handleLogin = (c) => { setAuth(c); sessionStorage.setItem('admin_auth', JSON.stringify(c)); };
        const handleLogout = () => { setAuth(null); sessionStorage.removeItem('admin_auth'); };

        return auth ? React.createElement(Dashboard, { auth, onLogout: handleLogout }) : React.createElement(Login, { onLogin: handleLogin });
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
