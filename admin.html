<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — InfoPesantren.online</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' },
              gold: { 500: '#f59e0b', 600: '#d97706' },
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { useState, useEffect } = React;
      const API_URL = 'https://infopesantren-api.akabonanza-official.workers.dev';

      function Icon({ name, className = 'w-5 h-5' }) {
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
        return React.createElement('i', { 'data-lucide': name, className });
      }

      // ================= KOMPONEN LOGIN =================
      function Login({ onLogin }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (username && password) onLogin({ username, password });
        };

        return React.createElement('div', { className: 'min-h-screen flex items-center justify-center bg-gray-100 p-4' },
          React.createElement('div', { className: 'bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-brand-600' },
            React.createElement('div', { className: 'text-center mb-8' },
              React.createElement('h1', { className: 'text-2xl font-extrabold text-gray-900' }, 'Admin Panel'),
              React.createElement('p', { className: 'text-gray-500 text-sm mt-1' }, 'InfoPesantren.online')
            ),
            React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' },
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Username'),
                React.createElement('input', {
                  type: 'text', required: true, value: username,
                  onChange: (e) => setUsername(e.target.value),
                  className: 'w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Password'),
                React.createElement('div', { className: 'relative' },
                  React.createElement('input', {
                    type: showPassword ? 'text' : 'password', required: true, value: password,
                    onChange: (e) => setPassword(e.target.value),
                    className: 'w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all pr-10'
                  }),
                  React.createElement('button', {
                    type: 'button', onClick: () => setShowPassword(!showPassword),
                    className: 'absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600'
                  }, React.createElement(Icon, { name: showPassword ? 'eye-off' : 'eye', className: 'w-5 h-5' }))
                )
              ),
              React.createElement('button', {
                type: 'submit',
                className: 'w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-lg transition-colors mt-2'
              }, 'Masuk ke Dashboard')
            )
          )
        );
      }

      // ================= KOMPONEN DASHBOARD =================
      function Dashboard({ auth, onLogout }) {
        const [articles, setArticles] = useState([]);
        const [loading, setLoading] = useState(true);

        const getAuthHeader = () => 'Basic ' + btoa(`${auth.username}:${auth.password}`);

        const fetchArticles = async () => {
          setLoading(true);
          try {
            // Kita pakai endpoint publik dulu untuk menampilkan list
            const res = await fetch(`${API_URL}/api/content/berita`);
            const json = await res.json();
            if (json.success) setArticles(json.data);
          } catch (err) {
            alert('Gagal mengambil data: ' + err.message);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => { fetchArticles(); }, []);

        const handleDelete = async (id) => {
          if (!confirm('Yakin ingin menghapus berita ini?')) return;
          try {
            const res = await fetch(`${API_URL}/api/berita/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': getAuthHeader() }
            });
            const json = await res.json();
            if (json.success) {
              alert('Berita berhasil dihapus');
              fetchArticles(); // Refresh list
            } else {
              alert('Gagal: ' + json.error);
            }
          } catch (err) { alert(err.message); }
        };

        return React.createElement('div', { className: 'min-h-screen bg-gray-100' },
          // Header
          React.createElement('header', { className: 'bg-white shadow-sm border-b border-gray-200' },
            React.createElement('div', { className: 'max-w-7xl mx-auto px-4 h-16 flex items-center justify-between' },
              React.createElement('h1', { className: 'text-xl font-bold text-gray-900' }, 'Admin Dashboard'),
              React.createElement('button', {
                onClick: onLogout,
                className: 'text-sm text-red-600 font-medium hover:bg-red-50 px-3 py-1.5 rounded-md transition-colors'
              }, 'Logout')
            )
          ),
          // Main Content
          React.createElement('main', { className: 'max-w-7xl mx-auto px-4 py-8' },
            React.createElement('div', { className: 'flex justify-between items-center mb-6' },
              React.createElement('h2', { className: 'text-2xl font-bold text-gray-800' }, 'Daftar Berita'),
              React.createElement('button', {
                className: 'bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2',
                onClick: () => alert('Fitur Tambah akan dibuat di tahap selanjutnya!')
              }, React.createElement(Icon, { name: 'plus', className: 'w-4 h-4' }), 'Tambah Berita')
            ),
            
            loading ? React.createElement('div', { className: 'text-center py-20 text-gray-500' }, 'Memuat data...') :
            React.createElement('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden' },
              React.createElement('table', { className: 'w-full text-left border-collapse' },
                React.createElement('thead', { className: 'bg-gray-50 border-b border-gray-200' },
                  React.createElement('tr', null,
                    React.createElement('th', { className: 'p-4 font-semibold text-sm text-gray-600' }, 'Judul'),
                    React.createElement('th', { className: 'p-4 font-semibold text-sm text-gray-600' }, 'Kategori'),
                    React.createElement('th', { className: 'p-4 font-semibold text-sm text-gray-600' }, 'Status'),
                    React.createElement('th', { className: 'p-4 font-semibold text-sm text-gray-600 text-right' }, 'Aksi')
                  )
                ),
                React.createElement('tbody', null,
                  articles.map(article => 
                    React.createElement('tr', { key: article.id, className: 'border-b border-gray-100 hover:bg-gray-50' },
                      React.createElement('td', { className: 'p-4 text-sm font-medium text-gray-900' }, article.title),
                      React.createElement('td', { className: 'p-4 text-sm text-gray-500' }, article.category),
                      React.createElement('td', { className: 'p-4 text-sm' }, 
                        React.createElement('span', { className: 'bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold uppercase' }, article.status || 'published')
                      ),
                      React.createElement('td', { className: 'p-4 text-right' },
                        React.createElement('button', {
                          onClick: () => handleDelete(article.id),
                          className: 'text-red-500 hover:text-red-700 p-1 rounded'
                        }, React.createElement(Icon, { name: 'trash-2', className: 'w-4 h-4' }))
                      )
                    )
                  )
                )
              ),
              articles.length === 0 && React.createElement('div', { className: 'p-8 text-center text-gray-500' }, 'Belum ada berita.')
            )
          )
        );
      }

      // ================= APP =================
      function App() {
        const [auth, setAuth] = useState(null);

        // Cek sessionStorage saat pertama kali load (opsional biar tidak login terus)
        useEffect(() => {
          const saved = sessionStorage.getItem('admin_auth');
          if (saved) setAuth(JSON.parse(saved));
        }, []);

        const handleLogin = (credentials) => {
          setAuth(credentials);
          sessionStorage.setItem('admin_auth', JSON.stringify(credentials));
        };

        const handleLogout = () => {
          setAuth(null);
          sessionStorage.removeItem('admin_auth');
        };

        return auth ? 
          React.createElement(Dashboard, { auth, onLogout: handleLogout }) : 
          React.createElement(Login, { onLogin: handleLogin });
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
